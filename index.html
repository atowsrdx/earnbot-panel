<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Earn Bot Admin</title><style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14161a;--mut:#6b7280;--bd:#e5e7eb;--pri:#2563eb;--ok:#16a34a;--bad:#dc2626;--warn:#b45309}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--tx:#e8eaed;--mut:#9aa3af;--bd:#262b36;--pri:#5b8def;--ok:#22a55a;--bad:#e5484d;--warn:#fbbf24}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:4px;padding:6px 8px}
nav{display:flex;gap:2px;overflow-x:auto;flex:1}
nav button{flex:0 0 auto;border:0;background:none;padding:8px 6px;font-size:13px;border-radius:8px;color:var(--mut)}
nav button.on{background:var(--pri);color:#fff}
header>button{padding:8px;font-size:13px}
main{max-width:900px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:16px;margin:18px 0 8px}
a{color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.stat{margin:0}.stat b{display:block;font-size:22px}.stat span{color:var(--mut);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sub{color:var(--mut);font-size:13px}.warn{color:var(--warn)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bd);color:var(--tx)}
.pill.pending{background:#fef3c7;color:#92400e}.pill.paid,.pill.on{background:#dcfce7;color:#166534}
.pill.rejected,.pill.banned{background:#fee2e2;color:#991b1b}
button,.btn{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;text-decoration:none;display:inline-block}
.pri{background:var(--pri)!important;border-color:var(--pri)!important;color:#fff!important}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
button.armed{outline:3px solid var(--warn)}
input{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.flash{padding:10px 12px;border-radius:10px;margin-bottom:10px}
.flash.ok{background:#dcfce7;color:#166534}.flash.err{background:#fee2e2;color:#991b1b}
code{background:var(--bg);padding:2px 6px;border-radius:6px;word-break:break-all}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{padding:6px 12px;border-radius:99px}.tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.empty{color:var(--mut);text-align:center;padding:24px}
.login{max-width:360px;margin:12vh auto;padding:0 14px}
</style></head><body>
<pre id="dbg" style="color:#ff8a8a;font-size:13px;white-space:pre-wrap;margin:8px"></pre><script>window.onerror=function(m,u,l){document.getElementById("dbg").textContent+="ERROR: "+m+" (line "+l+")\n";};</script>
<div id="login" class="login" hidden>
  <h1>Earn Bot admin</h1>
  <div id="loginErr" class="flash err" hidden></div>
  <div class="card"><div id="apiRow"><label>Function URL</label><input id="apiUrl" type="url" value="https://lhacsrehhpxveviayquu.supabase.co/functions/v1/bright-processor" autocapitalize="off" autocomplete="off"></div><label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <p><button id="loginBtn" class="pri" style="width:100%">Sign in</button></p></div>
</div>
<div id="app" hidden>
  <header><nav id="nav"></nav><button data-act="logout">Logout</button></header>
  <main><h1 id="title"></h1><div id="flash" class="flash" hidden></div><div id="main"></div></main>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var token='';try{token=sessionStorage.getItem('eb_t')||''}catch(x){}
var view='dash',wdS='pending',pg=1,qv='';

function esc(s){s=(s==null?'':String(s));return s.split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split('"').join('&quot;').split("'").join('&#39;');}
function money(p){return '₹'+(p/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fdt(ts){return ts?new Date(ts*1000).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'-';}
var API='';try{API=localStorage.getItem('eb_api')||'';}catch(x){}
if(API){$('apiRow').hidden=true;}
function call(action,args){
  if(!API){var i=$('apiUrl');API=(i&&i.value||'').trim();}
  if(!/^https:\/\//.test(API)){API='';return Promise.reject(new Error('Type the function URL in the first box (it starts with https://).'));}
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({token:token,action:action,args:args||{}})})
    .then(function(r){return r.text().then(function(t){
      var j;try{j=JSON.parse(t);}catch(x){API='';throw new Error('Server replied '+r.status+': '+t.slice(0,150));}
      if(action==='login'&&j&&j.ok){try{localStorage.setItem('eb_api',API);}catch(x){}}
      return j;});},
      function(){API='';throw new Error('Could not reach the server. Check the function URL in the first box.');});
}
function data(r){
  if(r&&r.err==='auth'){logout('Session expired. Please sign in again.');throw new Error('auth');}
  if(r&&r.err)throw new Error(r.err);
  return r;
}
function flash(msg,ok){var f=$('flash');f.className='flash '+(ok?'ok':'err');f.textContent=msg;f.hidden=false;window.scrollTo(0,0);}
function clearFlash(){$('flash').hidden=true;}
function setTitle(t){$('title').textContent=t;}
function show(h){$('main').innerHTML=h;}
function busy(on){$('main').style.opacity=on?'.5':'1';}
function fail(e){busy(false);var m=String(e&&e.message?e.message:e);if(m!=='auth')flash(m,false);}

function nav(){
  var items=[['dash','Dashboard'],['wd','Withdrawals'],['tasks','Tasks'],['users','Users']],h='';
  items.forEach(function(i){h+='<button data-act="nav" data-v="'+i[0]+'" class="'+((view===i[0]||(view==='user'&&i[0]==='users'))?'on':'')+'">'+i[1]+'</button>';});
  $('nav').innerHTML=h;
}
function pager(total,per){
  var pages=Math.max(1,Math.ceil(total/per));
  if(pages<2)return '';
  return '<div class="row"><button data-act="page" data-d="-1" '+(pg<=1?'disabled':'')+'>Prev</button><span class="sub">Page '+pg+' of '+pages+'</span><button data-act="page" data-d="1" '+(pg>=pages?'disabled':'')+'>Next</button></div>';
}

function wdCard(w){
  var name=w.username?'@'+w.username:'no username';
  var h='<div class="card"><div class="row"><div><b>#'+w.id+'</b> <span class="pill '+esc(w.status)+'">'+esc(w.status)+'</span></div><b>'+money(w.amount)+'</b></div>'
   +'<div class="sub"><a href="#" data-act="user" data-id="'+esc(w.user_id)+'">'+esc(name)+' · '+esc(w.user_id)+'</a> · requested '+fdt(w.created)+'</div>'
   +'<div class="row" style="margin-top:8px"><code>'+esc(w.upi)+'</code><button data-act="copy" data-v="'+esc(w.upi)+'">Copy</button></div>';
  if(w.dup)h+='<div class="sub warn">⚠ This UPI ID was also used by '+w.dup+' other account(s)</div>';
  if(w.status==='pending'){
    var link='upi://pay?pa='+encodeURIComponent(w.upi)+'&pn='+encodeURIComponent(w.username||'Payee')+'&am='+(w.amount/100).toFixed(2)+'&cu=INR&tn='+encodeURIComponent('Payout #'+w.id);
    h+='<div class="row" style="margin-top:10px"><a class="btn pri" href="'+esc(link)+'" target="_top">Pay in UPI app</a>'
     +'<button class="ok" data-act="decide" data-id="'+w.id+'" data-d="paid" data-confirm="1">Mark paid</button>'
     +'<button class="bad" data-act="decide" data-id="'+w.id+'" data-d="reject" data-confirm="1">Reject</button></div>';
  }else h+='<div class="sub">Decided '+fdt(w.decided)+'</div>';
  return h+'</div>';
}
function stat(v,l){return '<div class="card stat"><b>'+v+'</b><span>'+l+'</span></div>';}

function load(){
  busy(true);nav();var p;
  if(view==='dash')p=call('dashboard').then(function(r){renderDash(data(r));});
  else if(view==='wd')p=call('withdrawals',{status:wdS,page:pg}).then(function(r){renderWd(data(r));});
  else if(view==='tasks')p=call('tasks').then(function(r){renderTasks(data(r));});
  else if(view==='users')p=call('users',{q:qv,page:pg}).then(function(r){renderUsers(data(r));});
  else p=call('user',{id:qv}).then(function(r){renderUser(data(r));});
  p.then(function(){busy(false);}).catch(fail);
}
function go(v,keep){view=v;if(!keep){pg=1;}load();}

function renderDash(d){
  setTitle('Dashboard');var h='';
  if(!d.bot.connected){
    h+='<div class="card"><b>Last step: connect your bot</b><p class="sub">'+esc(d.bot.note)+'</p><button class="pri" data-act="connect">Connect bot</button></div>';
  }else{
    h+='<div class="card sub">🤖 @'+esc(d.bot.username)+' is connected'+(d.bot.pending?' · '+d.bot.pending+' updates waiting':'')
      +(d.bot.lastError?'<br>Telegram note: '+esc(d.bot.lastError)+' (harmless if the bot is replying normally)':'')+'</div>';
  }
  h+='<div class="grid">'+stat(d.users,'Users')+stat('+'+d.new24,'New (24h)')+stat(money(d.owed),'Owed to users')+stat(money(d.paid),'Paid out')
    +stat(d.pendingCount+' · '+money(d.pendingSum),'Pending payouts')+stat(d.activeTasks,'Active tasks')+stat(d.done24,'Tasks done (24h)')+'</div>';
  h+='<h2>Needs payout</h2>';
  h+=d.pending.length?d.pending.map(wdCard).join(''):'<div class="card empty">Nothing pending</div>';
  if(d.pendingCount>5)h+='<p><a href="#" data-act="nav" data-v="wd">See all '+d.pendingCount+' pending</a></p>';
  h+='<h2>Recent admin activity</h2>';
  h+=d.logs.length?'<div class="card">'+d.logs.map(function(l){return '<div class="sub">'+fdt(l.at)+' · <b>'+esc(l.action)+'</b> '+esc(l.detail)+'</div>';}).join('')+'</div>':'<div class="card empty">No actions yet.</div>';
  h+='<p class="sub">Your data lives in your Supabase project (Table Editor). Please do not edit it by hand.</p>';
  show(h);
}
function renderWd(d){
  setTitle('Withdrawals');
  var tabs='<div class="tabs">';
  ['pending','paid','rejected','all'].forEach(function(s){tabs+='<button data-act="wdtab" data-s="'+s+'" class="'+(s===wdS?'on':'')+'">'+s.charAt(0).toUpperCase()+s.slice(1)+'</button>';});
  tabs+='</div>';
  show(tabs+(d.items.length?d.items.map(wdCard).join(''):'<div class="card empty">Nothing here.</div>')+pager(d.total,d.per));
}
function renderTasks(d){
  setTitle('Tasks');
  var h='<h2>Add channel task</h2><div class="card"><label>Channel (@username or -100… id)</label><input id="c_chat" placeholder="@mychannel">'
   +'<label>Reward (₹)</label><input id="c_rew" inputmode="decimal">'
   +'<label>Invite link (only for private channels)</label><input id="c_inv" placeholder="https://t.me/+…">'
   +'<p><button class="pri" data-act="addchan">Add channel task</button></p><div class="sub">The bot must already be an admin of the channel.</div></div>'
   +'<h2>Add link task</h2><div class="card"><label>Title</label><input id="l_title" maxlength="80" placeholder="Visit our partner">'
   +'<label>Link</label><input id="l_url" placeholder="https://…"><label>Reward (₹)</label><input id="l_rew" inputmode="decimal">'
   +'<p><button class="pri" data-act="addlink">Add link task</button></p></div><h2>All tasks</h2>';
  h+=d.items.length?d.items.map(function(t){
    return '<div class="card"><div class="row"><div><b>#'+t.id+'</b> '+esc(t.title)+'</div><span class="pill '+(t.active?'on':'')+'">'+(t.active?'on':'off')+'</span></div>'
     +'<div class="sub">'+esc(t.kind)+' · reward '+money(t.reward)+' · done '+t.done+' · spent '+money(t.done*t.reward)+'</div>'
     +'<div class="sub"><code>'+esc(t.url)+'</code></div>'
     +'<p style="margin:8px 0 0"><button data-act="toggle" data-id="'+t.id+'">'+(t.active?'Disable':'Enable')+'</button></p></div>';
  }).join(''):'<div class="card empty">No tasks yet.</div>';
  show(h);
}

function renderUsers(d){
  setTitle('Users');
  var h='<div class="card"><div class="row" style="flex-wrap:nowrap"><input id="q" value="'+esc(qv)+'" placeholder="Search id, @username or UPI"><button class="pri" data-act="search">Search</button></div></div>';
  h+=d.items.length?d.items.map(function(u){
    return '<div class="card" data-act="user" data-id="'+esc(u.id)+'" style="cursor:pointer"><div class="row"><div><b>'+esc(u.username?'@'+u.username:'(no username)')+'</b>'
     +(u.banned?' <span class="pill banned">banned</span>':'')+'<div class="sub">'+esc(u.id)+' · joined '+fdt(u.joined)+'</div></div>'
     +'<div style="text-align:right"><b>'+money(u.balance)+'</b><div class="sub">earned '+money(u.earned)+'</div></div></div></div>';
  }).join(''):'<div class="card empty">No users found.</div>';
  show(h+pager(d.total,d.per));
}
function renderUser(d){
  var u=d.user;setTitle('User '+u.id);
  var h='<div class="card"><div class="row"><b>'+esc(u.username?'@'+u.username:'(no username)')+'</b>'+(u.banned?'<span class="pill banned">banned</span>':'')+'</div>'
   +'<div class="sub">Telegram ID '+esc(u.id)+' · joined '+fdt(u.joined)+'</div>'
   +'<p>Balance <b>'+money(u.balance)+'</b> · earned '+money(u.earned)+'<br>UPI: <code>'+esc(u.upi||'not set')+'</code><br>Tasks done: '+u.done+' · Referrals: '+u.refs+' · Referred by: '+esc(u.referred_by||'-')+'</p>'
   +'<button class="'+(u.banned?'':'bad')+'" data-act="ban" data-id="'+esc(u.id)+'" data-b="'+(u.banned?'0':'1')+'" data-confirm="1">'+(u.banned?'Unban':'Ban user')+'</button></div>'
   +'<h2>Adjust balance</h2><div class="card"><label>Amount in ₹ (negative to deduct)</label><input id="a_amt" inputmode="decimal" placeholder="5 or -2.5">'
   +'<label>Reason (saved in the activity log)</label><input id="a_why" maxlength="100"><p><button class="pri" data-act="adjust" data-id="'+esc(u.id)+'" data-confirm="1">Apply</button></p></div>'
   +'<h2>Recent withdrawals</h2>'+(d.withdrawals.length?d.withdrawals.map(wdCard).join(''):'<div class="card empty">None yet.</div>');
  show(h);
}

function act(name,args,after){
  busy(true);
  call(name,args).then(function(r){r=data(r);busy(false);flash(r.msg||'Done',true);after&&after();}).catch(fail);
}
function copyText(t,b){
  var done=function(){b.textContent='Copied';};
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){fallback();});return;}}catch(x){}
  fallback();
  function fallback(){try{var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);done();}catch(x){b.textContent=t;}}
}
function val(i){return ($(i)||{}).value||'';}

document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act');
  if(b.tagName==='A')ev.preventDefault();
  if(b.hasAttribute('data-confirm')&&b.getAttribute('data-armed')!=='1'){
    b.setAttribute('data-armed','1');b.setAttribute('data-label',b.textContent);b.textContent='Tap again to confirm';b.classList.add('armed');
    setTimeout(function(){if(b.getAttribute('data-armed')==='1'){b.setAttribute('data-armed','0');b.textContent=b.getAttribute('data-label');b.classList.remove('armed');}},4000);
    return;
  }
  clearFlash();
  var id=b.getAttribute('data-id');
  if(a==='nav'){qv='';go(b.getAttribute('data-v'));}
  else if(a==='logout')logout('');
  else if(a==='connect'){act('connect',{},function(){go('dash',true);});}
  else if(a==='decide')act('decide',{id:id,decision:b.getAttribute('data-d')},function(){load();});
  else if(a==='copy')copyText(b.getAttribute('data-v'),b);
  else if(a==='wdtab'){wdS=b.getAttribute('data-s');pg=1;load();}
  else if(a==='page'){pg+=Number(b.getAttribute('data-d'));load();}
  else if(a==='toggle')act('toggleTask',{id:id},load);
  else if(a==='addchan')act('addChannel',{chat:val('c_chat'),reward:val('c_rew'),invite:val('c_inv')},load);
  else if(a==='addlink')act('addLink',{title:val('l_title'),url:val('l_url'),reward:val('l_rew')},load);
  else if(a==='search'){qv=val('q');pg=1;load();}
  else if(a==='user'){qv=id;view='user';load();}
  else if(a==='ban')act('ban',{id:id,banned:b.getAttribute('data-b')==='1'},load);
  else if(a==='adjust')act('adjust',{id:id,amount:val('a_amt'),reason:val('a_why')},load);
});
document.addEventListener('keydown',function(ev){
  if(ev.key!=='Enter')return;
  if(ev.target.id==='pw')login();
  if(ev.target.id==='q'){qv=val('q');pg=1;load();}
});

function login(){
  var pw=$('pw').value;if(!pw)return;
  $('loginBtn').disabled=true;$('loginErr').hidden=true;
  call('login',{password:pw}).then(function(r){
    $('loginBtn').disabled=false;
    if(r.err){$('loginErr').textContent=r.err;$('loginErr').hidden=false;return;}
    token=r.token;try{sessionStorage.setItem('eb_t',token)}catch(x){}
    $('pw').value='';enter();
  }).catch(function(e){$('loginBtn').disabled=false;$('loginErr').textContent=String(e&&e.message?e.message:e);$('loginErr').hidden=false;});
}
function enter(){$('login').hidden=true;$('app').hidden=false;view='dash';load();}
function logout(msg){
  token='';try{sessionStorage.removeItem('eb_t')}catch(x){}
  $('app').hidden=true;$('login').hidden=false;
  if(msg){$('loginErr').textContent=msg;$('loginErr').hidden=false;}else $('loginErr').hidden=true;
}
$('loginBtn').addEventListener('click',login);
if(token)enter();else $('login').hidden=false;
})();
</script><script>setTimeout(function(){var a=document.getElementById("login"),b=document.getElementById("app");if(a.hidden&&b.hidden)document.getElementById("dbg").textContent+="Panel script did not start. Check Js1 and Js2 are fully pasted.\n";},1000);</script></body></html>
